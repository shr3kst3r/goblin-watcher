[project]
name = "goblin-watcher"
version = "0.1.0"
description = "Parallel AI coding agents in git worktrees. Replaces Conductor/Superset."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "goblin-watcher contributors" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "httpx>=0.27",
  "tomli-w>=1.0",
  "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "ty",
  "ruff>=0.5",
  "pre-commit>=4.0",
]

[project.scripts]
gw = "goblin_watcher.cli:main"
goblin-watcher = "goblin_watcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goblin_watcher"]

[tool.uv]
# Use the asdf-managed Python (resolved via .tool-versions / .python-version).
# Never download a managed Python — keep the toolchain consistent with the rest of dev's setup.
python-preference = "only-system"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID", "PTH", "N"]
ignore = []
# Typer uses function calls in defaults as its idiom; treat them as immutable.
extend-safe-fixes = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
addopts = "-ra --cov=goblin_watcher --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
# This project is a subprocess orchestrator by design. AGENTS.md mandates list[str]
# args (never f-strung commands), so the generic subprocess warnings are noise here.
skips = [
  "B101",  # assert_used
  "B404",  # blacklist: import subprocess — the entire project is a subprocess orchestrator
  "B603",  # subprocess_without_shell_equals_true — always list[str] per AGENTS.md
  "B606",  # start_process_with_no_shell — execvp into known agent binaries is intentional
  "B607",  # start_process_with_partial_path — PATH lookup for git/gh/tmux/agent CLIs is correct
]
